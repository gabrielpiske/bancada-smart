spring.application.name=appsmartweb-test

# Banco em memória H2 para execução autônoma da suíte de testes
spring.datasource.url=jdbc:h2:mem:smartweb_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Configurações da Bancada Smart em ambiente de teste
bancada.plc.default-subnet=10.74.241
bancada.plc.port=102
bancada.plc.poll-interval-ms=800
bancada.plc.connect-timeout-ms=2000
bancada.plc.read-timeout-ms=2000
bancada.plc.read-only=false
bancada.plc.simulation-mode=true
bancada.esp32.url=http://10.74.241.245:80/api/move_pos
