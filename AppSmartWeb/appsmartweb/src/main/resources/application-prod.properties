spring.application.name=appsmartweb

# Configurações do Live Reload
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# Configurações do SQL SERVER (via variáveis de ambiente)
spring.datasource.url=${DB_PROD_URL:jdbc:sqlserver://10.74.241.200\\SQLEXPRESS;databaseName=GestorEstoqueDB1;encrypt=false;trustServerCertificate=false}
spring.datasource.username=${DB_PROD_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configurações do Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
