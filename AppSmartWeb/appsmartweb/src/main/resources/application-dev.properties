spring.application.name=appsmartweb

# Configurações do Live Reload
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# Configurações do MySQL (com suporte a variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartweb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
server.port=${SERVER_PORT:8090}

# Configurações do Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Dialeto do Hibernate para MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
